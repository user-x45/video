<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動画コンバーター</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d29;--sub:#6b7085;--ac:#5b5bf0;--bd:#e3e5ef;--ok:#1a9d5c;--warn:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#14151d;--card:#1e2030;--tx:#eceefb;--sub:#9a9fb8;--ac:#8b8bff;--bd:#2d3047;--ok:#4cd28a;--warn:#f0b35a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 2px}
p.s{color:var(--sub);margin:0 0 18px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
#drop{border:2px dashed var(--bd);border-radius:14px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--sub)}
#drop.on{border-color:var(--ac);color:var(--ac)}
label{display:block;font-size:.8rem;color:var(--sub);margin:12px 0 4px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.9rem}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#msg{font-size:.85rem;color:var(--sub);margin-top:8px;white-space:pre-wrap}
#warn{font-size:.82rem;color:var(--warn);margin-top:8px;white-space:pre-wrap}
video,audio{width:100%;border-radius:10px;margin-top:10px}
video{background:#000}
img{max-width:100%;border-radius:10px;margin-top:10px}
a.dl{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--ok);color:#fff;text-decoration:none;font-weight:600}
.note{font-size:.78rem;color:var(--sub)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>🎞️ 動画コンバーター</h1>
<p class="s">まずブラウザ標準のWebCodecsで高速変換し、対応できない形式だけffmpeg.wasmに切り替えます。</p>

<div class="card">
  <div id="drop">タップして動画・音声・GIFを選択<br><small>またはここにドラッグ＆ドロップ</small></div>
  <input type="file" id="file" accept="video/*,audio/*,image/gif,.mkv,.avi,.mov,.flv,.wmv,.ts,.mts,.m2ts,.3gp,.mpg,.mpeg,.ogv,.m4v,.webm,.mp4,.vob,.asf,.divx,.mxf,.gif" hidden>
  <div id="info" class="note" style="margin-top:10px" hidden></div>
</div>

<div class="card" id="opts" hidden>
  <label>変換後の形式</label>
  <select id="fmt"></select>

  <div id="vopts">
    <div class="row">
      <div><label>解像度</label>
        <select id="res"><option value="0" selected>元のまま</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></div>
      <div><label>画質</label>
        <select id="q"><option value="auto" selected>元のまま（可能なら再エンコードなし）</option><option value="8000000|20">高</option><option value="4000000|24">標準</option><option value="1500000|30">低（小さい）</option></select></div>
    </div>
    <label class="chk"><input type="checkbox" id="force"> 必ず再エンコードする（古い環境でも再生したいとき）</label>
  </div>

  <div id="gopts" hidden>
    <div class="row">
      <div><label>出力幅</label>
        <select id="gw"><option value="0">元のまま</option><option value="720">720 px</option><option value="480" selected>480 px</option><option value="360">360 px</option></select></div>
      <div><label>フレームレート</label>
        <select id="gf"><option value="8">8 fps</option><option value="12" selected>12 fps</option><option value="15">15 fps</option><option value="24">24 fps</option></select></div>
    </div>
    <label>ループ</label>
    <select id="gl"><option value="1" selected>無限ループ</option><option value="0">1回再生</option></select>
    <p class="note">GIFは長さに応じて急激に大きくなります。約15秒以内がおすすめです。</p>
  </div>

  <div id="aopts" hidden>
    <label>音質</label>
    <select id="ab"><option value="96k">96 kbps</option><option value="128k">128 kbps</option><option value="192k" selected>192 kbps</option><option value="320k">320 kbps</option></select>
  </div>

  <button id="go" disabled>準備中…</button>
  <div class="bar"><i id="pb"></i></div>
  <div id="msg"></div>
  <div id="warn"></div>
</div>

<div class="card" id="out" hidden>
  <strong>完成しました 🎉</strong>
  <div id="pvbox"></div>
  <a class="dl" id="dl">ダウンロード</a>
</div>
</main>

<script type="module">
import*as M from 'https://cdn.jsdelivr.net/npm/mediabunny@1/+esm';
import{GIFEncoder,quantize,applyPalette}from 'https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm';

const $=id=>document.getElementById(id);
const MB_INPUT=new Set(['mp4','m4v','m4a','mov','mkv','mka','webm','ogg','ogv','oga','opus','mp3','wav','flac','aac','ts','mts','m2ts']);

const X264=['-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p'];
const FORMATS=[
 {l:'MP4 (H.264/AAC)',e:'mp4',k:'v',m:'video/mp4',copy:1,mb:()=>({f:new M.Mp4OutputFormat(),vc:'avc',ac:'aac'}),ff:c=>[...X264,'-crf',c,'-c:a','aac','-b:a','128k','-movflags','+faststart']},
 {l:'MOV (H.264/AAC)',e:'mov',k:'v',m:'video/quicktime',copy:1,mb:()=>({f:new M.MovOutputFormat(),vc:'avc',ac:'aac'}),ff:c=>[...X264,'-crf',c,'-c:a','aac','-b:a','128k']},
 {l:'MKV (H.264/AAC)',e:'mkv',k:'v',m:'video/x-matroska',copy:1,mb:()=>({f:new M.MkvOutputFormat(),vc:'avc',ac:'aac'}),ff:c=>[...X264,'-crf',c,'-c:a','aac','-b:a','128k']},
 {l:'WebM (VP9/Opus)',e:'webm',k:'v',m:'video/webm',mb:()=>({f:new M.WebMOutputFormat(),vc:'vp9',ac:'opus'}),ff:c=>['-c:v','libvpx','-deadline','realtime','-cpu-used','8','-b:v','0','-crf',String(+c+4),'-c:a','libvorbis']},
 {l:'AVI (MPEG-4/MP3)',e:'avi',k:'v',m:'video/x-msvideo',ff:()=>['-c:v','mpeg4','-q:v','4','-c:a','libmp3lame','-b:a','128k']},
 {l:'FLV (H.264/AAC)',e:'flv',k:'v',m:'video/x-flv',ff:c=>[...X264,'-crf',c,'-c:a','aac','-b:a','128k']},
 {l:'GIF（アニメーション）',e:'gif',k:'g',m:'image/gif',ff:()=>[]},
 {l:'音声 M4A (AAC)',e:'m4a',k:'a',m:'audio/mp4',mb:()=>({f:new M.Mp4OutputFormat(),ac:'aac'}),ff:b=>['-vn','-c:a','aac','-b:a',b]},
 {l:'音声 WAV',e:'wav',k:'a',m:'audio/wav',mb:()=>({f:new M.WavOutputFormat(),ac:'pcm-s16'}),ff:()=>['-vn','-c:a','pcm_s16le']},
 {l:'音声 Opus (OGG)',e:'opus',k:'a',m:'audio/ogg',mb:()=>({f:new M.OggOutputFormat(),ac:'opus'}),ff:b=>['-vn','-c:a','libopus','-b:a',b]},
 {l:'音声 MP3',e:'mp3',k:'a',m:'audio/mpeg',ff:b=>['-vn','-c:a','libmp3lame','-b:a',b]},
 {l:'音声 OGG (Vorbis)',e:'ogg',k:'a',m:'audio/ogg',ff:b=>['-vn','-c:a','libvorbis','-b:a',b]},
 {l:'音声 FLAC',e:'flac',k:'a',m:'audio/flac',ff:()=>['-vn','-c:a','flac']}
];
$('fmt').innerHTML=FORMATS.map((f,i)=>`<option value="${i}">${f.l}</option>`).join('');

const syncOpts=()=>{
  const k=FORMATS[$('fmt').value].k;
  $('vopts').hidden=k!=='v';
  $('gopts').hidden=k!=='g';
  $('aopts').hidden=k!=='a';
};
$('fmt').onchange=syncOpts;
syncOpts();

let file=null,busy=false,outUrl=null,ff=null;
const setP=(p,t)=>{$('pb').style.width=(Math.max(0,Math.min(1,p))*100).toFixed(0)+'%';if(t!=null)$('msg').textContent=t};
const extOf=n=>((n.match(/\.([^.]+)$/)||[,''])[1]).toLowerCase();
const refresh=()=>{$('go').disabled=!file||busy;$('go').textContent=busy?'変換中…':'変換する'};
refresh();

const drop=$('drop');
drop.onclick=()=>$('file').click();
$('file').onchange=e=>pick(e.target.files[0]);
['dragover','dragenter'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>pick(e.dataTransfer.files[0]));

function pick(f){
  if(!f)return;
  file=f;
  drop.textContent='✅ '+f.name;
  $('info').hidden=false;
  $('info').textContent=(f.size/1048576).toFixed(1)+' MB';
  $('opts').hidden=false;
  $('out').hidden=true;
  $('warn').textContent='';
  setP(0,'');
  refresh();
}

function loadScript(src){
  return new Promise((ok,ng)=>{
    const s=document.createElement('script');
    s.src=src;s.onload=ok;s.onerror=()=>ng(new Error('スクリプトを読み込めません: '+src));
    document.head.appendChild(s);
  });
}

async function getFF(){
  if(ff)return ff;
  setP(0,'ffmpeg.wasmを読み込み中（初回のみ約30MB）…');
  await loadScript('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js');
  const inst=new FFmpegWASM.FFmpeg();
  const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
  const{toBlobURL}=FFmpegUtil;
  await inst.load({
    classWorkerURL:await toBlobURL('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js','text/javascript'),
    coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),
    wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')
  });
  inst.on('log',({message})=>{window.__log=(window.__log||'')+message+'\n'});
  ff=inst;
  return ff;
}

function readOpts(){
  const q=$('q').value;
  const[br,crf]=q==='auto'?[0,'23']:q.split('|');
  return{
    h:+$('res').value,
    br:+br,
    crf:String(crf),
    force:$('force').checked,
    ab:$('ab').value,
    gw:+$('gw').value,
    gf:+$('gf').value,
    gl:$('gl').value==='1'
  };
}

async function viaMediabunny(f,o){
  const input=new M.Input({source:new M.BlobSource(file),formats:M.ALL_FORMATS});
  const cfg=f.mb();
  const target=new M.BufferTarget();
  const output=new M.Output({format:cfg.f,target});
  const opts={input,output};
  if(f.k==='a'){
    opts.video={discard:true};
    opts.audio={codec:cfg.ac};
  }else{
    const v={codec:cfg.vc};
    const track=await input.getPrimaryVideoTrack();
    if(o.h&&track&&track.displayHeight>o.h)v.height=o.h;
    if(o.br)v.bitrate=o.br;
    if(o.force)v.forceTranscode=true;
    opts.video=v;
    opts.audio={codec:cfg.ac};
  }
  const conv=await M.Conversion.init(opts);
  if(!conv.isValid){
    const why=(conv.discardedTracks||[]).map(t=>t.reason).join(', ');
    throw new Error('WebCodecsでは変換できない組み合わせです'+(why?'（'+why+'）':''));
  }
  conv.onProgress=p=>setP(p,'変換中… '+Math.round(p*100)+'%');
  await conv.execute();
  const dropped=(conv.discardedTracks||[]).filter(t=>t.reason!=='discarded_by_user');
  if(dropped.length){
    $('warn').textContent='変換できず除外されたトラック: '+dropped.length+' 件（'+[...new Set(dropped.map(t=>t.reason))].join(', ')+'）';
  }
  return new Blob([target.buffer],{type:f.m});
}

async function gifViaMediabunny(o){
  const input=new M.Input({source:new M.BlobSource(file),formats:M.ALL_FORMATS});
  const track=await input.getPrimaryVideoTrack();
  if(!track)throw new Error('映像トラックがありません');
  if(!await track.canDecode())throw new Error('このブラウザでは映像をデコードできません');
  const dur=await input.computeDuration();
  const sw=track.displayWidth,sh=track.displayHeight;
  const w=o.gw&&sw>o.gw?o.gw:sw;
  const h=Math.max(1,Math.round(sh*w/sw));
  const sink=new M.CanvasSink(track,{width:w,height:h,fit:'fill'});
  const n=Math.max(1,Math.floor(dur*o.gf));
  const times=Array.from({length:n},(_,i)=>i/o.gf);
  const gif=GIFEncoder();
  let i=0;
  for await(const item of sink.canvasesAtTimestamps(times)){
    i++;
    if(!item)continue;
    const cw=item.canvas.width,ch=item.canvas.height;
    const data=item.canvas.getContext('2d').getImageData(0,0,cw,ch).data;
    const palette=quantize(data,256);
    const index=applyPalette(data,palette);
    gif.writeFrame(index,cw,ch,{palette,delay:Math.round(1000/o.gf),repeat:o.gl?0:-1});
    setP(i/n,'GIFを生成中… '+i+' / '+n+' フレーム');
  }
  gif.finish();
  return new Blob([gif.bytes()],{type:'image/gif'});
}

async function viaFFmpeg(f,o){
  const inst=await getFF();
  const ext=extOf(file.name)||'bin';
  const inName='input.'+ext,outName='output.'+f.e;
  const onProg=({progress})=>setP(progress,'ffmpeg.wasmで変換中… '+Math.round(progress*100)+'%');
  inst.on('progress',onProg);
  window.__log='';
  try{
    setP(0,'ファイルを読み込み中…');
    await inst.writeFile(inName,await FFmpegUtil.fetchFile(file));
    const scale=o.h?['-vf','scale=-2:'+o.h]:[];
    let done=false;
    if(f.copy&&!o.h&&!o.br&&!o.force&&f.k==='v'){
      setP(0,'再エンコードなしで変換を試行中…');
      const code=await inst.exec(['-i',inName,'-c','copy',outName]);
      if(code===0)done=true;
      else try{await inst.deleteFile(outName)}catch(e){}
    }
    if(!done){
      let args=['-i',inName];
      if(f.k==='v')args.push(...scale,...f.ff(o.crf));
      else if(f.k==='g'){
        const w=o.gw?o.gw:-2;
        const sc=o.gw?`scale=${w}:-2`:'scale=iw:-2';
        args.push('-vf',`fps=${o.gf},${sc}:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse`,'-loop',o.gl?'0':'-1');
      }else args.push(...f.ff(o.ab));
      args.push(outName);
      const code=await inst.exec(args);
      if(code!==0)throw new Error('ffmpegでの変換に失敗しました（コード '+code+'）\n'+(window.__log||'').split('\n').slice(-4).join('\n'));
    }
    const data=await inst.readFile(outName);
    try{await inst.deleteFile(inName);await inst.deleteFile(outName)}catch(e){}
    return new Blob([data.buffer],{type:f.m});
  }finally{
    inst.off('progress',onProg);
  }
}

async function convert(){
  const f=FORMATS[$('fmt').value];
  const o=readOpts();
  const ext=extOf(file.name);
  const canMB=MB_INPUT.has(ext)&&(f.mb||f.k==='g');
  if(canMB){
    try{
      setP(0,'WebCodecsで変換中…');
      const blob=f.k==='g'?await gifViaMediabunny(o):await viaMediabunny(f,o);
      return{blob,engine:'WebCodecs（mediabunny）'};
    }catch(err){
      console.warn(err);
      $('warn').textContent='WebCodecsで変換できなかったためffmpeg.wasmに切り替えました：'+(err.message||err);
      setP(0,'ffmpeg.wasmに切り替え中…');
    }
  }
  const blob=await viaFFmpeg(f,o);
  return{blob,engine:'ffmpeg.wasm'};
}

$('go').onclick=async()=>{
  if(!file||busy)return;
  busy=true;refresh();
  $('out').hidden=true;
  $('warn').textContent='';
  const f=FORMATS[$('fmt').value];
  const t0=performance.now();
  try{
    const{blob,engine}=await convert();
    if(outUrl)URL.revokeObjectURL(outUrl);
    outUrl=URL.createObjectURL(blob);
    $('dl').href=outUrl;
    $('dl').download=file.name.replace(/\.[^.]+$/,'')+'.'+f.e;
    $('dl').textContent='ダウンロード（'+(blob.size/1048576).toFixed(1)+' MB）';
    $('pvbox').innerHTML=f.k==='g'?`<img src="${outUrl}">`:f.k==='a'?`<audio controls src="${outUrl}"></audio>`:`<video controls playsinline src="${outUrl}"></video>`;
    $('out').hidden=false;
    setP(1,'完了（'+engine+'・'+((performance.now()-t0)/1000).toFixed(1)+' 秒）');
  }catch(err){
    setP(0,'エラー：'+(err.message||err));
  }
  busy=false;refresh();
};
</script>
</body>
</html>
